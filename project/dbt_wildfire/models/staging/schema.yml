version: 2

sources:
  - name: wildfire_raw
    database: "{{ env_var('GCP_PROJECT_ID') }}"
    schema: "{{ env_var('BQ_DATASET', 'wildfire_data') }}"
    tables:
      - name: raw_wildfires
        description: "Raw wildfire occurrence data from the FPA FOD dataset (1992-2020)"
        columns:
          - name: FOD_ID
            description: "Global unique fire ID"
            tests:
              - not_null
              - unique
          - name: DISCOVERY_DATE
            description: "Date the fire was discovered"
            tests:
              - not_null
          - name: STATE
            description: "Two-letter state abbreviation"
            tests:
              - not_null
          - name: FIRE_SIZE
            description: "Fire size in acres"
            tests:
              - not_null
          - name: FIRE_SIZE_CLASS
            description: "National fire size classification (A through G)"
            tests:
              - accepted_values:
                  values: ['A', 'B', 'C', 'D', 'E', 'F', 'G']

models:
  - name: stg_wildfires
    description: "Cleaned and typed wildfire records with standardised column names"
    columns:
      - name: fire_id
        description: "Global unique fire ID (from FOD_ID)"
        tests:
          - not_null
          - unique
      - name: discovery_date
        description: "Date the fire was discovered"
        tests:
          - not_null
      - name: state
        description: "Two-letter state abbreviation"
        tests:
          - not_null
      - name: fire_size_acres
        description: "Fire size in acres"
        tests:
          - not_null
      - name: fire_size_class
        description: "National fire size classification (A through G)"
        tests:
          - accepted_values:
              values: ['A', 'B', 'C', 'D', 'E', 'F', 'G']
