version: 2

sources:
  - name: wildfire_raw
    database: "{{ env_var('GCP_PROJECT_ID') }}"
    schema: "{{ env_var('BQ_DATASET', 'wildfire_data') }}"
    tables:
      - name: raw_wildfires
        description: "Raw wildfire data from the FW_Veg_Rem_Combined dataset (US wildfires with weather and vegetation attributes)"
        columns:
          - name: disc_clean_date
            description: "Discovery date (cleaned)"
            tests:
              - not_null
          - name: state
            description: "Two-letter state abbreviation"
            tests:
              - not_null
          - name: fire_size
            description: "Fire size in acres"
            tests:
              - not_null
          - name: fire_size_class
            description: "National fire size classification (A through G)"
            tests:
              - accepted_values:
                  values: ['A', 'B', 'C', 'D', 'E', 'F', 'G']

models:
  - name: stg_wildfires
    description: "Cleaned and typed wildfire records with standardised column names"
    columns:
      - name: fire_id
        description: "Surrogate row-number ID"
        tests:
          - not_null
          - unique
      - name: discovery_date
        description: "Date the fire was discovered"
        tests:
          - not_null
      - name: state
        description: "Two-letter state abbreviation"
        tests:
          - not_null
      - name: fire_size_acres
        description: "Fire size in acres"
        tests:
          - not_null
      - name: fire_size_class
        description: "National fire size classification (A through G)"
        tests:
          - accepted_values:
              values: ['A', 'B', 'C', 'D', 'E', 'F', 'G']
